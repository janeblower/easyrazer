name: release

on:
  push:
    branches: [master]
    tags: ["[0-9]*"]
    paths-ignore: ["docs/**", "**.md"]

permissions:
  contents: write

concurrency: release-${{ github.ref }}

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: >-
            `EasyRazer.exe` is the build for most PCs (x64, with the virtual gamepad).
            `EasyRazer-x64-no-gamepad.exe` leaves out the gamepad and its hidshim driver.
            `EasyRazer-arm64.exe` is for Windows on ARM and needs the OpenCL, OpenGL and Vulkan
            Compatibility Pack from the Microsoft Store.
            `EasyRazer-arm64-gamepad-experimental.exe` adds the gamepad on ARM; its driver
            has not been tested on hardware yet.
        run: |
          cd dist
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            gh release create "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
              --notes "$NOTES" --generate-notes
          else
            # Recreated on every merge so the pre-release stays at the top of the list.
            gh release delete nightly --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
            gh release create nightly * --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
              --title "Nightly ${GITHUB_SHA::7}" --notes "$NOTES" --generate-notes
          fi
