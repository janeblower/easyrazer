[package]
name = "razer-core"
version = "0.1.0"
edition.workspace = true

[features]
hid = ["dep:hidapi", "dep:windows-sys"]
fake = []

[dependencies]
hidapi = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties"] }
