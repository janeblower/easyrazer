[package]
name = "easyrazer-ui"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "easyrazer"
path = "src/main.rs"

[dependencies]
easyrazer-backend = { path = "../backend", default-features = false }
razer-core = { path = "../core" }
egui = "0.37"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "accesskit", "clipboard"] }
egui_extras = { version = "0.37", features = ["svg"] }
tray-icon = "0.26"
rfd = "0.17"
serde = "1"
serde_json = "1"

[build-dependencies]
winresource = "0.1.34"

[features]
default = ["glow", "gamepad"]
gamepad = ["easyrazer-backend/gamepad"]
glow = ["eframe/glow"]
wgpu = ["eframe/wgpu"]
