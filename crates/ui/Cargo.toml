[package]
name = "easyrazer-ui"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[dependencies]
easyrazer-backend = { path = "../backend" }
razer-core = { path = "../core" }
egui = "0.37"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "accesskit", "clipboard"] }
egui_extras = { version = "0.37", features = ["svg"] }
tray-icon = "0.26"

[features]
default = ["glow"]
glow = ["eframe/glow"]
wgpu = ["eframe/wgpu"]
