<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6BFF4A"/>
      <stop offset="0.55" stop-color="#44D62C"/>
      <stop offset="1" stop-color="#2E9E1C"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A1A"/>
      <stop offset="1" stop-color="#C2410C"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Угловатая «лезвийная» R -->
    <path id="R" fill-rule="evenodd" d="
      M150 130 L170 110 L335 110 L385 160 L385 238 L345 278
      L398 400 L322 400 L276 292 L222 292 L222 382 L204 400 L150 400 Z
      M222 172 L298 172 L316 190 L316 214 L298 232 L222 232 Z"/>
  </defs>

  <!-- <rect width="512" height="512" fill="#000"/> -->

  <g transform="translate(-24 -8)">
    <!-- Оранжевая тень в форме буквы -->
    <use href="#R" fill="url(#orange)" transform="translate(20 20)"/>
    <!-- Зелёная буква -->
    <use href="#R" fill="url(#green)" filter="url(#glow)"/>
  </g>
</svg>
