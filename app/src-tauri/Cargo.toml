[package]
name = "easyrazer"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
hidapi = "2"
hidshim = { git = "https://github.com/janeblower/hidshim", tag = "0.3.0" }
razer-core = { path = "../../crates/core", features = ["hid"] }
windows-sys = { version = "0.61", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Power", "Win32_UI_Shell", "Win32_System_Registry", "Win32_System_Diagnostics_ToolHelp", "Win32_Foundation", "Win32_Security", "Win32_System_StationsAndDesktops", "Win32_System_Shutdown", "Win32_System_Threading", "Win32_System_Memory", "Win32_UI_Accessibility", "Win32_UI_Input", "Win32_Graphics_Gdi", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_Networking_WinHttp", "Win32_Security_Cryptography"] }
winreg = "0.56"
getrandom = "0.3"
open = { version = "5.3.3", features = ["shellexecute-on-windows"] }

[dev-dependencies]
razer-core = { path = "../../crates/core", features = ["hid", "fake"] }
